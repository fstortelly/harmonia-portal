<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinamentos · Harmonia Animal</title>
<meta name="theme-color" content="#4E2A84">
<link rel="icon" type="image/png" href="/icone.png">
<link rel="apple-touch-icon" href="/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.data{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.data b{display:block;font-size:22px;line-height:1;font-weight:800}
.data span{font-size:13px;color:var(--muted)}
.codigo-in{font-size:34px;letter-spacing:.3em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.grande-ok{text-align:center;padding:40px 16px}
.grande-ok svg{width:84px;height:84px}
.ativ{border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:16px;margin-bottom:12px}
.ativ-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tipo{font-size:13px;font-weight:700;color:var(--roxo)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tipo{color:#C9B3EE}}
.perg{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.opc{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-s);margin-bottom:8px;cursor:pointer}
.opc input{width:20px;height:20px;margin-top:1px;accent-color:var(--teal);flex:none}
.opc.certa{border-color:var(--ok);background:var(--ok-bg)}
.opc.errada{border-color:var(--alerta);background:var(--alerta-bg)}
.nota{font-size:40px;font-weight:800;line-height:1}
/* palco (tela grande) */
.palco{position:fixed;inset:0;background:var(--roxo);color:#fff;z-index:20;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.palco-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}
@media (max-width:820px){.palco-in{grid-template-columns:1fr}}
.palco h1{color:#fff;font-size:26px;margin:0 0 4px}
.palco .sub{color:#D9CCF0;margin-bottom:18px}
.qr-caixa{background:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;color:#17202A}
#qr{width:min(58vh,100%);max-width:420px;aspect-ratio:1}
#qr img,#qr canvas{width:100%!important;height:auto!important}
.cod-grande{font-size:clamp(44px,8vw,76px);font-weight:800;letter-spacing:.14em;font-variant-numeric:tabular-nums;margin-top:12px;line-height:1}
.contagem{width:100%;height:6px;background:#E6E0F0;border-radius:99px;margin-top:14px;overflow:hidden}
.contagem i{display:block;height:100%;background:var(--teal);transition:width 1s linear}
.qr-dica{font-size:14px;color:#5B6770;margin-top:10px;text-align:center}
.presentes-n{font-size:64px;font-weight:800;line-height:1}
.presentes-l{max-height:30vh;overflow:auto;margin-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.presentes-l div,.palco-ativ div.l{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;gap:10px;align-items:center}
.presentes-l small,.palco small{color:#D9CCF0}
.palco-ativ{margin-top:22px}
.palco-ativ h2{color:#fff;margin:0 0 6px;font-size:17px}
.btn.claro{background:#fff;color:var(--roxo)}
.btn.contorno{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
/* telas cheias: sorteio e resultado */
.cheia{position:fixed;inset:0;z-index:30;background:var(--roxo-2);color:#fff;overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.cheia.centro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rolo{font-size:clamp(38px,9vw,96px);font-weight:800;letter-spacing:-.02em;min-height:1.3em;line-height:1.15}
.rolo.fim{animation:pulo .5s ease-out}
@keyframes pulo{0%{transform:scale(.8);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.res-in{max-width:900px;margin:0 auto}
.res-in h1{color:#fff;font-size:clamp(24px,4vw,40px)}
.rbar{margin:0 0 16px}
.rbar .t{display:flex;justify-content:space-between;gap:12px;font-size:clamp(16px,2.2vw,22px);font-weight:600;margin-bottom:6px}
.rbar .b{height:clamp(14px,2.4vw,24px);background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.rbar .b i{display:block;height:100%;background:#5FD3C8;border-radius:99px;transition:width .6s ease}
.rbar .t small{color:#D9CCF0;font-weight:500}
.rtexto{background:rgba(255,255,255,.09);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:clamp(15px,2vw,19px);white-space:pre-wrap}
.rtexto small{display:block;color:#D9CCF0;margin-top:6px;font-size:14px}
@media (prefers-reduced-motion:reduce){.rolo.fim{animation:none}.contagem i,.rbar .b i{transition:none}}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-family:"Figtree",Arial,sans-serif}
  #print h1{font-size:20px;margin:0 0 4px}
  #print table{font-size:12px}
  #print th,#print td{border-bottom:1px solid #999;color:#000}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script src="/config.js"></script>
<script src="/comum.js"></script>
<script>
const dia = iso => iso.slice(8,10), mes = iso => MES[+iso.slice(5,7)-1];
const MODAL = { presencial:'Presencial', online:'Online', hibrido:'Presencial e online' };
const TIPOS = { quiz:'Quiz', enquete:'Enquete', aberta:'Pergunta aberta', link:'Questionário externo' };
const STATUS = { ok:['Presente','ok'], manual:['Lançado manualmente','ok'], fora_do_local:['Fora do local','no'], sem_localizacao:['Sem localização','av'] };
const ICON = {
  ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#2E7D4F"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  treino:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  meus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  rel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  assinar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v7M14 20h3"/></svg>'
};
const S = { acesso:null, ger:false, view:'assinar', meus:[], dados:null, pendente:null, resultado:null, treinoId:null,
  ativTreino:null, editando:null, relDe:null, relAte:null, live:null };
const tk = () => H.token;

// ================= render =================
function render() {
  const V = { assinar:vAssinar, confirmar:vConfirmar, assinado:vAssinado, meus:vMeus, ativs:vAtivs,
    treinos:vTreinos, treino:vTreino, form:vForm, rel:vRel };
  $('#app').innerHTML = cabecalho('Treinamentos', S.acesso.pessoa.nome, '<br><a href="/">Portal</a>')
    + `<main class="wrap">${(V[S.view] || vAssinar)()}</main>` + vAbas();
  if (S.view === 'assinar') setTimeout(() => $('#cod')?.focus(), 50);
}
function vAbas() {
  const grupo = { assinar:['assinar','confirmar','assinado'], meus:['meus','ativs'], treinos:['treinos','treino','form'], rel:['rel'] };
  const a = (v, ic, t) => `<button onclick="ir('${v}')" aria-current="${grupo[v].includes(S.view)}">${ic}${t}</button>`;
  return `<nav class="abas">${a('assinar',ICON.assinar,'Assinar')}${a('meus',ICON.meus,'Meus')}${S.ger ? a('treinos',ICON.treino,'Treinamentos') + a('rel',ICON.rel,'Relatórios') : ''}</nav>`;
}
async function ir(v) {
  S.view = v; render(); window.scrollTo(0,0);
  try {
    if (['treinos','rel'].includes(v)) { await carregarGer(); render(); }
    if (['meus','ativs'].includes(v)) { S.meus = await rpc('treino_meus', { p_token:tk() }); render(); }
  } catch (e) { toast(e.message, true); }
}
async function carregarGer() { S.dados = await rpc('treino_ger_dados', { p_token:tk() }); }

// ================= assinar =================
function vAssinar() {
  return `<h1>Assinar presença</h1>
  <div class="card">
    <p>Aponte a câmera do celular para o QR code da tela do treinamento, ou digite o código de 6 números que aparece embaixo dele.</p>
    <label class="f"><span>Código da tela</span>
      <input id="cod" class="codigo-in" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"
        oninput="this.value=this.value.replace(/\\D/g,'');if(this.value.length===6)validarCodigo(this.value)"></label>
    <button class="btn full" onclick="validarCodigo($('#cod').value)">Continuar</button>
  </div>
  <p class="muted small" style="margin-top:14px">O código muda a cada 15 segundos. Se aparecer como expirado, digite o que está na tela agora.</p>`;
}
async function validarCodigo(c) {
  try { S.pendente = await rpc('treino_validar_codigo', { p_codigo:(c || '').trim() }); S.view = 'confirmar'; render(); }
  catch (e) { toast(e.message, true); }
}
function vConfirmar() {
  const p = S.pendente;
  if (!p) { S.view = 'assinar'; return vAssinar(); }
  return `<h1>${esc(p.titulo)}</h1><div class="card">
    ${p.modalidade === 'hibrido' ? `<p>Você está participando de onde?</p>
      <div class="linha-btn"><button class="btn" onclick="assinar('presencial')">Estou no local</button>
      <button class="btn sec" onclick="assinar('online')">Estou online</button></div>`
    : `<p>${p.modalidade === 'presencial' && p.tem_local ? 'Vamos confirmar sua localização junto com a assinatura. Se o celular pedir, permita o acesso à localização.' : 'Confirme para registrar sua presença.'}</p>
      <button class="btn full" onclick="assinar('${p.modalidade}')">Assinar presença</button>`}</div>
    <div class="linha-btn"><button class="voltar" onclick="S.pendente=null;sessionStorage.removeItem('treino_pend');ir('assinar')">‹ Cancelar</button></div>`;
}
async function assinar(modo) {
  const p = S.pendente;
  $$('main .btn').forEach(b => b.disabled = true);
  let pos = null;
  if (modo === 'presencial' && p.tem_local) { toast('Confirmando sua localização…'); pos = await posicao(); }
  try {
    S.resultado = await rpc('treino_assinar', { p_token:tk(), p_treino:p.treino_id, p_ticket:p.ticket, p_modo:modo,
      p_lat:pos?.lat ?? null, p_lng:pos?.lng ?? null });
    S.pendente = null; try { sessionStorage.removeItem('treino_pend'); } catch {}
    S.view = 'assinado'; render();
  } catch (e) {
    toast(e.message, true);
    if (/expirou|inválido/i.test(e.message)) { S.pendente = null; ir('assinar'); } else render();
  }
}
function vAssinado() {
  const r = S.resultado || {};
  let obs = '';
  if (r.ja_assinado) obs = 'Sua presença já estava registrada neste treinamento.';
  else if (r.status === 'fora_do_local') obs = 'Sua localização ficou fora do local do treinamento. A presença foi registrada e vai para conferência.';
  else if (r.status === 'sem_localizacao') obs = 'Não conseguimos ler sua localização. A presença foi registrada e vai para conferência.';
  else if (r.atrasado) obs = 'Registrado como chegada com atraso.';
  return `<div class="grande-ok">${ICON.ok}
    <h1 style="margin-top:14px">${r.ja_assinado ? 'Você já assinou' : 'Presença registrada'}</h1>
    <p><b>${esc(r.titulo || '')}</b></p>${obs ? `<p class="muted">${obs}</p>` : ''}
    <div class="linha-btn" style="justify-content:center"><button class="btn" onclick="abrirAtivs('${r.treino_id}')">Ver atividades do treinamento</button></div></div>`;
}

// ================= meus treinamentos =================
function vMeus() {
  const hoje = hojeISO();
  const prox = S.meus.filter(t => t.data >= hoje && !t.presente).reverse();
  const hist = S.meus.filter(t => t.data < hoje || t.presente);
  const conta = hist.filter(t => t.obrigatorio);
  const pres = conta.filter(t => t.presente).length;
  const pct = conta.length ? Math.round(pres / conta.length * 100) : null;
  const it = (t, st) => {
    const abertas = t.atividades.filter(a => a.liberada && !a.minha).length;
    return `<div class="item"><div class="data"><b>${dia(t.data)}</b><span>${mes(t.data)}</span></div>
    <div class="grow"><h3>${esc(t.titulo)}</h3><div class="muted small">${t.hora_inicio}${t.hora_fim ? '–' + t.hora_fim : ''} · ${MODAL[t.modalidade]}${t.local_texto ? ' · ' + esc(t.local_texto) : ''}</div>
    ${t.conteudo ? `<details class="small" style="margin-top:6px"><summary>Conteúdo</summary><div class="conteudo">${esc(t.conteudo)}</div></details>` : ''}
    <div class="tags">${st}${t.presente && t.n_atividades ? `<button class="btn mini ${abertas ? '' : 'sec'}" onclick="abrirAtivs('${t.id}')">${abertas ? `Responder atividades (${abertas})` : 'Atividades'}</button>` : ''}</div></div></div>`;
  };
  return `<h1>Meus treinamentos</h1>
    <div class="resumo"><div><b>${pct === null ? '–' : pct + '%'}</b><span>presença</span></div>
    <div><b>${pres}</b><span>participações</span></div><div><b>${conta.length - pres}</b><span>faltas</span></div></div>
    <h2>Próximos</h2>
    ${prox.length ? `<div class="lista">${prox.map(t => it(t, `<span class="tag ${t.obrigatorio ? '' : 'av'}">${t.obrigatorio ? 'Obrigatório' : 'Opcional'}</span>`)).join('')}</div>` : '<div class="vazio">Nenhum treinamento agendado para você.</div>'}
    <h2>Histórico</h2>
    ${hist.length ? `<div class="lista">${hist.map(t => it(t, t.presente ? '<span class="tag ok">Presente</span>' : '<span class="tag no">Faltou</span>')).join('')}</div>` : '<div class="vazio">Seu histórico aparece aqui depois do primeiro treinamento.</div>'}`;
}

// ================= responder atividades =================
async function abrirAtivs(id) {
  S.ativTreino = id; S.view = 'ativs'; render();
  try { S.meus = await rpc('treino_meus', { p_token:tk() }); render(); } catch (e) { toast(e.message, true); }
}
function vAtivs() {
  const t = S.meus.find(x => x.id === S.ativTreino);
  if (!t) return '<p class="muted">Carregando…</p>';
  const lista = t.atividades.map(a => {
    let corpo = '';
    const d = a.dados;
    if (a.tipo === 'quiz') {
      if (a.minha) {
        const acertos = d.perguntas.filter((q, i) => a.minha.respostas[i] === a.gabarito[i]).length;
        corpo = `<div class="nota">${acertos}/${d.perguntas.length}</div><p class="muted small">acertos</p>` +
          d.perguntas.map((q, i) => `<div class="perg"><b>${i + 1}. ${esc(q.texto)}</b><div style="margin-top:8px">${q.opcoes.map((o, j) => {
            const cls = j === a.gabarito[i] ? 'certa' : (j === a.minha.respostas[i] ? 'errada' : '');
            return `<div class="opc ${cls}">${esc(o)}${j === a.gabarito[i] ? ' <b style="margin-left:auto">certa</b>' : (j === a.minha.respostas[i] ? ' <span style="margin-left:auto">sua resposta</span>' : '')}</div>`;
          }).join('')}</div></div>`).join('');
      } else {
        corpo = d.perguntas.map((q, i) => `<div class="perg"><b>${i + 1}. ${esc(q.texto)}</b><div style="margin-top:8px">${q.opcoes.map((o, j) =>
          `<label class="opc"><input type="radio" name="q-${a.id}-${i}" value="${j}">${esc(o)}</label>`).join('')}</div></div>`).join('') +
          `<button class="btn full" style="margin-top:12px" onclick="responder('${a.id}')">Enviar respostas</button>`;
      }
    } else if (a.tipo === 'enquete') {
      if (a.minha) corpo = `<p class="muted">Voto registrado: <b>${a.minha.opcoes.map(i => esc(d.opcoes[i])).join(', ')}</b></p>`;
      else corpo = `<p><b>${esc(d.pergunta)}</b>${d.multipla ? ' <span class="muted small">(pode marcar mais de uma)</span>' : ''}</p>` +
        d.opcoes.map((o, j) => `<label class="opc"><input type="${d.multipla ? 'checkbox' : 'radio'}" name="e-${a.id}" value="${j}">${esc(o)}</label>`).join('') +
        `${a.anonima ? '<p class="muted small">Votação anônima: ninguém vê o seu voto.</p>' : ''}<button class="btn full" style="margin-top:6px" onclick="responder('${a.id}')">Votar</button>`;
    } else if (a.tipo === 'aberta') {
      if (a.minha) corpo = `<p><b>${esc(d.pergunta)}</b></p><div class="card conteudo">${esc(a.minha.texto)}</div>`;
      else corpo = `<p><b>${esc(d.pergunta)}</b></p><textarea id="t-${a.id}" placeholder="Sua resposta"></textarea>
        ${a.anonima ? '<p class="muted small" style="margin-top:6px">Resposta anônima.</p>' : ''}<button class="btn full" style="margin-top:10px" onclick="responder('${a.id}')">Enviar resposta</button>`;
    } else if (a.tipo === 'link') {
      corpo = `${d.instrucao ? `<p>${esc(d.instrucao)}</p>` : ''}<div class="linha-btn" style="margin-top:0">
        <a class="btn ${a.minha ? 'sec' : ''}" href="${esc(d.url)}" target="_blank" rel="noopener">Abrir questionário</a>
        ${a.minha ? '<span class="tag ok" style="align-self:center">Você marcou como respondido</span>' : `<button class="btn sec" onclick="responder('${a.id}')">Já respondi</button>`}</div>`;
    }
    return `<div class="ativ"><div class="ativ-cab"><span class="tipo">${TIPOS[a.tipo]}</span>${a.minha ? '<span class="tag ok">Respondida</span>' : ''}</div>
      ${a.titulo ? `<h3 style="margin-bottom:8px">${esc(a.titulo)}</h3>` : ''}${corpo}</div>`;
  }).join('');
  const faltam = t.n_atividades - t.atividades.length;
  return `<button class="voltar" onclick="ir('meus')">‹ Meus treinamentos</button><h1>${esc(t.titulo)}</h1>
    ${!t.presente ? '<div class="vazio">Assine a presença para responder as atividades.</div>' :
      (lista || '<div class="vazio">Nenhuma atividade liberada ainda. Quando o responsável liberar, toque em “Atualizar”.</div>')}
    ${t.presente && faltam > 0 && lista ? `<p class="muted small">Ainda há ${faltam} atividade${faltam > 1 ? 's' : ''} que ${faltam > 1 ? 'serão liberadas' : 'será liberada'} durante o treinamento.</p>` : ''}
    <div class="linha-btn"><button class="btn sec" onclick="abrirAtivs('${t.id}')">Atualizar</button></div>`;
}
async function responder(aid) {
  const t = S.meus.find(x => x.id === S.ativTreino), a = t.atividades.find(x => x.id === aid);
  let resp;
  if (a.tipo === 'quiz') {
    const r = a.dados.perguntas.map((q, i) => { const s = $(`input[name="q-${aid}-${i}"]:checked`); return s ? +s.value : null; });
    if (r.includes(null)) return toast('Responda todas as perguntas.', true);
    resp = { respostas:r };
  } else if (a.tipo === 'enquete') {
    const r = $$(`input[name="e-${aid}"]:checked`).map(x => +x.value);
    if (!r.length) return toast('Escolha uma opção.', true);
    resp = { opcoes:r };
  } else if (a.tipo === 'aberta') {
    const v = $(`#t-${aid}`).value.trim(); if (!v) return toast('Escreva sua resposta.', true);
    resp = { texto:v };
  } else resp = { feito:true };
  try {
    const r = await rpc('treino_responder', { p_token:tk(), p_atividade:aid, p_resposta:resp });
    toast(a.tipo === 'quiz' ? `Você acertou ${r.acertos} de ${r.total}.` : 'Resposta registrada.');
    abrirAtivs(S.ativTreino);
  } catch (e) { toast(e.message, true); }
}

// ================= gerência: dados auxiliares =================
function convocados(t) {
  const pres = new Set(S.dados.presencas.filter(p => p.treinamento_id === t.id).map(p => p.pessoa_id));
  return S.dados.pessoas.filter(p => (p.convocavel && (!t.funcoes.length || t.funcoes.includes(p.perfil))) || pres.has(p.id));
}
const presencasDe = tid => S.dados.presencas.filter(p => p.treinamento_id === tid);
const atividadesDe = tid => S.dados.atividades.filter(a => a.treinamento_id === tid);

// ================= gerência: lista =================
function vTreinos() {
  if (!S.dados) return '<p class="muted">Carregando…</p>';
  const hoje = hojeISO(), ts = S.dados.treinamentos;
  const prox = ts.filter(t => t.data >= hoje).slice().reverse(), pass = ts.filter(t => t.data < hoje);
  const it = t => {
    const c = convocados(t).length, p = presencasDe(t.id).length, na = atividadesDe(t.id).length;
    return `<button class="item" onclick="abrirTreino('${t.id}')"><div class="data"><b>${dia(t.data)}</b><span>${mes(t.data)}</span></div>
      <div class="grow"><h3>${esc(t.titulo)}</h3><div class="muted small">${t.hora_inicio}${t.hora_fim ? '–' + t.hora_fim : ''} · ${MODAL[t.modalidade]}</div>
      <div class="tags">${t.sessao_aberta ? '<span class="tag live">Lista aberta</span>' : ''}<span class="tag">${p} de ${c} presentes</span>
      ${na ? `<span class="tag">${na} atividade${na > 1 ? 's' : ''}</span>` : ''}${t.obrigatorio ? '' : '<span class="tag av">Opcional</span>'}</div></div></button>`;
  };
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Treinamentos</h1>
    <button class="btn" onclick="novoTreino()">Novo treinamento</button></div>
    <h2>Próximos e de hoje</h2>
    ${prox.length ? `<div class="lista">${prox.map(it).join('')}</div>` : '<div class="vazio">Nenhum treinamento agendado. Crie o próximo em “Novo treinamento”.</div>'}
    ${pass.length ? `<h2>Realizados</h2><div class="lista">${pass.map(it).join('')}</div>` : ''}`;
}
function abrirTreino(id) { S.treinoId = id; S.view = 'treino'; render(); window.scrollTo(0,0); }

// ================= gerência: detalhe =================
function vTreino() {
  const t = S.dados?.treinamentos.find(x => x.id === S.treinoId);
  if (!t) { S.view = 'treinos'; return vTreinos(); }
  const pres = new Map(presencasDe(t.id).map(p => [p.pessoa_id, p]));
  const conv = convocados(t).sort((a, b) => (pres.has(b.id) - pres.has(a.id)) || a.nome.localeCompare(b.nome));
  const linhas = conv.map(p => {
    const pr = pres.get(p.id);
    let tags;
    if (pr) {
      const [lbl, cls] = STATUS[pr.status] || ['Presente','ok'];
      tags = `<span class="tag ${cls}">${lbl}${pr.status === 'fora_do_local' && pr.distancia_m ? ` (${pr.distancia_m} m)` : ''}</span>`
        + (pr.modo === 'online' ? '<span class="tag">Online</span>' : '') + (pr.atrasado ? '<span class="tag av">Atrasado</span>' : '')
        + (pr.status !== 'manual' ? `<span class="muted small">${horaDe(pr.assinado_em)}</span>` : '');
    } else tags = '<span class="tag no">Ausente</span>';
    return `<div class="pessoa-l"><div class="grow"><b>${esc(p.nome)}</b> <span class="muted small">${esc(p.perfil || '')}</span><div class="tags">${tags}</div></div>
      <button class="btn sec mini" onclick="marcarManual('${p.id}',${!pr})">${pr ? 'Remover' : 'Marcar presente'}</button></div>`;
  }).join('');
  const ativs = atividadesDe(t.id).map(a => `<div class="pessoa-l"><div class="grow"><span class="tipo">${TIPOS[a.tipo]}</span><br>
      <b>${esc(a.titulo || a.dados.pergunta || '')}</b><div class="tags">${a.liberada ? '<span class="tag live">Liberada</span>' : '<span class="tag av">Fechada</span>'}
      <span class="tag">${a.n_respostas} resposta${a.n_respostas === 1 ? '' : 's'}</span>${a.anonima ? '<span class="tag">Anônima</span>' : ''}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><button class="btn sec mini" onclick="liberar('${a.id}',${!a.liberada})">${a.liberada ? 'Fechar' : 'Liberar'}</button>
      <button class="btn sec mini" onclick="verResultado('${a.id}',true)">Resultado</button></div></div>`).join('');
  const sorteados = (t.sorteios || []).map(s => `<li><b>${esc(s.nome)}</b> <span class="muted small">${horaDe(s.em)}</span></li>`).join('');
  return `<button class="voltar" onclick="ir('treinos')">‹ Treinamentos</button>
    <h1>${esc(t.titulo)}</h1>
    <p class="muted">${dataBR(t.data)} · ${t.hora_inicio}${t.hora_fim ? '–' + t.hora_fim : ''} · ${MODAL[t.modalidade]}${t.local_texto ? ' · ' + esc(t.local_texto) : ''}${t.responsavel ? '<br>Responsável: ' + esc(t.responsavel) : ''}</p>
    <p class="small muted">Convocados: ${t.funcoes.length ? esc(t.funcoes.join(', ')) : 'todos com acesso a Treinamentos'} · ${t.obrigatorio ? 'obrigatório' : 'opcional'}</p>
    ${t.conteudo ? `<div class="card conteudo" style="margin-bottom:14px">${esc(t.conteudo)}</div>` : ''}
    <div class="linha-btn">
      <button class="btn roxo" onclick="abrirSessao('${t.id}')">${t.sessao_aberta ? 'Mostrar QR code' : 'Abrir lista de presença'}</button>
      <button class="btn sec" onclick="sortear('${t.id}')">Sortear</button>
      <button class="btn sec" onclick="imprimir('${t.id}')">Imprimir lista</button>
      <button class="btn sec" onclick="editarTreino('${t.id}')">Editar</button></div>
    ${ativs ? `<h2>Atividades</h2><div class="card" style="padding:4px 16px">${ativs}</div>` : ''}
    <h2>Presença: ${pres.size} de ${conv.length}</h2>
    <div class="card" style="padding:4px 16px">${linhas || '<p class="muted" style="padding:12px 0">Ninguém convocado. Confira os perfis em “Editar” e os acessos no portal.</p>'}</div>
    ${sorteados ? `<h2>Sorteados</h2><ol>${sorteados}</ol>` : ''}
    <div class="linha-btn" style="margin-top:32px"><button class="btn perigo" onclick="excluirTreino('${t.id}')">Excluir treinamento</button></div>`;
}
async function marcarManual(pid, marcar) {
  try { await rpc('treino_ger_presenca', { p_token:tk(), p_treino:S.treinoId, p_pessoa:pid, p_marcar:marcar }); await carregarGer(); render(); }
  catch (e) { toast(e.message, true); }
}
async function liberar(aid, lib) {
  try { await rpc('treino_ger_liberar', { p_token:tk(), p_atividade:aid, p_liberar:lib }); toast(lib ? 'Atividade liberada.' : 'Atividade fechada.');
    if (S.live) { S.live.ativSig = ''; tickLive(); } else { await carregarGer(); render(); } }
  catch (e) { toast(e.message, true); }
}
async function excluirTreino(id) {
  if (!confirm('Excluir este treinamento, com presenças e respostas das atividades?')) return;
  try { await rpc('treino_ger_excluir', { p_token:tk(), p_treino:id }); toast('Treinamento excluído.'); ir('treinos'); }
  catch (e) { toast(e.message, true); }
}

// ================= gerência: formulário =================

}
function editarTreino(id) {
  const t = S.dados.treinamentos.find(x => x.id === id);
  S.editando = { ...t, atividades:atividadesDe(id).map(a => ({ id:a.id, tipo:a.tipo, titulo:a.titulo, anonima:a.anonima, dados:JSON.parse(JSON.stringify(a.dados)), n:a.n_respostas })) };
  S.view = 'form'; render(); window.scrollTo(0,0);
}
const linhasOpc = (opcoes, correta) => (opcoes || []).map((o, j) => (j === correta ? '*' : '') + o).join('\n');
function edAtiv(a, i) {
  const d = a.dados; let campos = '';
  if (a.tipo === 'quiz') {
    campos = (d.perguntas || []).map((q, k) => `<div class="perg"><div class="ativ-cab"><b>Pergunta ${k + 1}</b>
        ${d.perguntas.length > 1 ? `<button class="btn sec mini" onclick="rmPerg(${i},${k})">Remover</button>` : ''}</div>
      <label class="f"><span>Pergunta</span><input type="text" data-a="${i}" data-q="${k}" data-c="texto" value="${esc(q.texto)}"></label>
      <label class="f"><span>Opções, uma por linha. Coloque * antes da certa.</span><textarea data-a="${i}" data-q="${k}" data-c="opcoes" placeholder="*Amoxicilina com clavulanato&#10;Enrofloxacina&#10;Cefalexina">${esc(linhasOpc(q.opcoes, q.correta))}</textarea></label></div>`).join('')
      + `<button class="btn sec mini" onclick="addPerg(${i})">Adicionar pergunta</button>`;
  } else if (a.tipo === 'enquete') {
    campos = `<label class="f"><span>Pergunta</span><input type="text" data-a="${i}" data-c="pergunta" value="${esc(d.pergunta || '')}" placeholder="Ex.: Qual antibiótico vocês usam para piodermite?"></label>
      <label class="f"><span>Opções, uma por linha</span><textarea data-a="${i}" data-c="opcoes">${esc((d.opcoes || []).join('\n'))}</textarea></label>
      <label class="chk"><input type="checkbox" data-a="${i}" data-c="multipla" ${d.multipla ? 'checked' : ''}> Pode marcar mais de uma</label>
      <label class="chk"><input type="checkbox" data-a="${i}" data-c="anonima" ${a.anonima ? 'checked' : ''}> Anônima (ninguém vê quem votou em quê)</label>`;
  } else if (a.tipo === 'aberta') {
    campos = `<label class="f"><span>Pergunta</span><textarea data-a="${i}" data-c="pergunta" style="min-height:70px">${esc(d.pergunta || '')}</textarea></label>
      <label class="chk"><input type="checkbox" data-a="${i}" data-c="anonima" ${a.anonima ? 'checked' : ''}> Respostas anônimas</label>`;
  } else {
    campos = `<label class="f"><span>Link do questionário</span><input type="url" data-a="${i}" data-c="url" value="${esc(d.url || '')}" placeholder="https://forms.gle/…"></label>
      <label class="f"><span>Instrução (opcional)</span><input type="text" data-a="${i}" data-c="instrucao" value="${esc(d.instrucao || '')}"></label>`;
  }
  return `<div class="ativ"><div class="ativ-cab"><span class="tipo">${TIPOS[a.tipo]}</span>
      <button class="btn sec mini" onclick="rmAtiv(${i})">Remover</button></div>
    ${a.n ? `<p class="muted small">Já tem ${a.n} resposta${a.n > 1 ? 's' : ''}. Mudar as perguntas agora pode confundir o resultado.</p>` : ''}
    <label class="f"><span>Título (opcional)</span><input type="text" data-a="${i}" data-c="titulo" value="${esc(a.titulo || '')}"></label>${campos}</div>`;
}
function vForm() {
  const t = S.editando;
  return `<button class="voltar" onclick="${t.id ? `abrirTreino('${t.id}')` : `ir('treinos')`}">‹ Voltar</button>
  <h1>${t.id ? 'Editar treinamento' : 'Novo treinamento'}</h1>
  <label class="f"><span>Título</span><input type="text" id="ft" value="${esc(t.titulo)}" placeholder="Ex.: Protocolo de atendimento de emergência"></label>
  <div class="duas"><label class="f"><span>Data</span><input type="date" id="fd" value="${t.data}"></label>
    <label class="f"><span>Modalidade</span><select id="fm">${Object.entries(MODAL).map(([k, v]) => `<option value="${k}" ${t.modalidade === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
  <div class="duas"><label class="f"><span>Início</span><input type="time" id="fi" value="${t.hora_inicio || ''}"></label>
    <label class="f"><span>Término</span><input type="time" id="ff" value="${t.hora_fim || ''}"></label></div>
  <label class="f"><span>Local ou link</span><input type="text" id="fl" value="${esc(t.local_texto || '')}" placeholder="Ex.: Unidade Barão, sala de reunião / link do Meet"></label>
  <label class="f"><span>Responsável</span><input type="text" id="fr" value="${esc(t.responsavel || '')}"></label>
  <label class="f"><span>Conteúdo</span><textarea id="fc" placeholder="Pauta, tópicos, material de apoio">${esc(t.conteudo || '')}</textarea></label>
  <div class="f"><span class="rot">Quem deve participar</span>
    <div class="chips">${S.dados.perfis.map(f => `<label><input type="checkbox" class="ffun" value="${esc(f)}" ${t.funcoes.includes(f) ? 'checked' : ''}>${esc(f)}</label>`).join('')}</div>
    <p class="muted small" style="margin-top:6px">Sem nenhum marcado, todos com acesso a Treinamentos são convocados.</p></div>
  <label class="chk"><input type="checkbox" id="fo" ${t.obrigatorio ? 'checked' : ''}> Presença obrigatória (conta nos relatórios de falta)</label>
  <label class="f" style="max-width:220px"><span>Tolerância de distância (m)</span><input type="number" id="fz" min="30" step="10" value="${t.raio_m || 150}"></label>
  <p class="muted small">No presencial, quem assinar a mais que essa distância do aparelho que abriu a lista fica marcado como “fora do local”.</p>
  <h2>Atividades</h2>
  <p class="muted small">Só quem assinou a presença responde. Você libera cada uma na hora certa, durante o treinamento.</p>
  ${t.atividades.map(edAtiv).join('')}
  <div class="linha-btn" style="margin-top:0">${Object.entries(TIPOS).map(([k, v]) => `<button class="btn sec mini" onclick="addAtiv('${k}')">+ ${v}</button>`).join('')}</div>
  <div class="linha-btn" style="margin-top:28px"><button class="btn" onclick="salvarTreino()">Salvar treinamento</button></div>`;

function lerForm() {
  const t = S.editando;
  Object.assign(t, { titulo:$('#ft').value, data:$('#fd').value, modalidade:$('#fm').value, hora_inicio:$('#fi').value,
    hora_fim:$('#ff').value, local_texto:$('#fl').value, responsavel:$('#fr').value, conteudo:$('#fc').value,
    obrigatorio:$('#fo').checked, raio_m:$('#fz').value, funcoes:$$('.ffun:checked').map(x => x.value) });
  for (const el of $$('[data-a]')) {
    const a = t.atividades[+el.dataset.a], c = el.dataset.c, val = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.q !== undefined) {
      const q = a.dados.perguntas[+el.dataset.q];
      if (c === 'texto') q.texto = val;
      else {
        const ls = val.split('\n').map(s => s.trim()).filter(Boolean);
        q.correta = ls.findIndex(s => s.startsWith('*'));
        q.opcoes = ls.map(s => s.replace(/^\*\s*/, ''));
        q._marcas = ls.filter(s => s.startsWith('*')).length;
      }
    } else if (c === 'titulo') a.titulo = val;
    else if (c === 'anonima') a.anonima = val;
    else if (c === 'opcoes') a.dados.opcoes = val.split('\n').map(s => s.trim()).filter(Boolean);
    else a.dados[c] = val;
  }
}
function addAtiv(tipo) {
  lerForm();
  const dados = { quiz:{ perguntas:[{ texto:'', opcoes:[], correta:-1 }] }, enquete:{ pergunta:'', opcoes:[], multipla:false },
    aberta:{ pergunta:'' }, link:{ url:'', instrucao:'' } }[tipo];
  S.editando.atividades.push({ tipo, titulo:'', anonima:false, dados }); render();
  const cards = $$('.ativ'); cards[cards.length - 1]?.scrollIntoView({ block:'center' });
}
function rmAtiv(i) { lerForm(); if (S.editando.atividades[i].n && !confirm('Esta atividade já tem respostas. Remover mesmo?')) return; S.editando.atividades.splice(i, 1); render(); }
function addPerg(i) { lerForm(); S.editando.atividades[i].dados.perguntas.push({ texto:'', opcoes:[], correta:-1 }); render(); }
function rmPerg(i, k) { lerForm(); S.editando.atividades[i].dados.perguntas.splice(k, 1); render(); }
function validarAtivs(ats) {
  for (const [n, a] of ats.entries()) {
    const nome = `${TIPOS[a.tipo]} (atividade ${n + 1})`;
    if (a.tipo === 'quiz') {
      if (!a.dados.perguntas.length) return `${nome}: adicione uma pergunta.`;
      for (const [k, q] of a.dados.perguntas.entries()) {
        if (!q.texto.trim()) return `${nome}: escreva a pergunta ${k + 1}.`;
        if (q.opcoes.length < 2) return `${nome}: a pergunta ${k + 1} precisa de pelo menos 2 opções.`;
        if ((q._marcas ?? (q.correta >= 0 ? 1 : 0)) !== 1) return `${nome}: marque com * uma única opção certa na pergunta ${k + 1}.`;
      }
    } else if (a.tipo === 'enquete') {
      if (!a.dados.pergunta.trim()) return `${nome}: escreva a pergunta.`;
      if (a.dados.opcoes.length < 2) return `${nome}: coloque pelo menos 2 opções.`;
    } else if (a.tipo === 'aberta') { if (!a.dados.pergunta.trim()) return `${nome}: escreva a pergunta.`; }
    else if (!/^https?:\/\/\S+$/i.test(a.dados.url.trim())) return `${nome}: cole um link completo, começando com https://`;
  }
  return null;
}
async function salvarTreino() {
  lerForm();
  const t = S.editando, erro = validarAtivs(t.atividades);
  if (erro) return toast(erro, true);
  const atividades = t.atividades.map(a => ({ id:a.id || '', tipo:a.tipo, titulo:a.titulo, anonima:a.anonima,
    dados: a.tipo === 'quiz' ? { perguntas:a.dados.perguntas.map(q => ({ texto:q.texto, opcoes:q.opcoes, correta:q.correta })) }
         : a.tipo === 'link' ? { url:a.dados.url.trim(), instrucao:a.dados.instrucao } : a.dados }));
  const p = { id:t.id || '', titulo:t.titulo, data:t.data, modalidade:t.modalidade, hora_inicio:t.hora_inicio, hora_fim:t.hora_fim,
    local_texto:t.local_texto, responsavel:t.responsavel, conteudo:t.conteudo, obrigatorio:t.obrigatorio, raio_m:t.raio_m,
    funcoes:t.funcoes, atividades };
  try { const id = await rpc('treino_ger_salvar_treino', { p_token:tk(), p }); await carregarGer(); toast('Treinamento salvo.'); abrirTreino(id); }
  catch (e) { toast(e.message, true); }
}

// ================= tela ao vivo =================
let liveTimer = null, qrObj = null;
async function abrirSessao(id) {
  const t = S.dados.treinamentos.find(x => x.id === id);
  let pos = null;
  if (!t.sessao_aberta && t.modalidade !== 'online') {
    toast('Pegando a localização deste aparelho como local do treinamento…');
    pos = await posicao();
    if (!pos) toast('Sem localização: a lista abre, mas sem conferir a distância.', true);
  }
  try { if (!t.sessao_aberta) await rpc('treino_ger_sessao', { p_token:tk(), p_treino:id, p_abrir:true, p_lat:pos?.lat ?? null, p_lng:pos?.lng ?? null }); }
  catch (e) { return toast(e.message, true); }
  S.live = { id, codigo:null, ativSig:'' };
  const el = document.createElement('div'); el.className = 'palco'; el.id = 'palco';
  el.innerHTML = `<div class="palco-in">
    <div><h1>${esc(t.titulo)}</h1><div class="sub">Aponte a câmera do celular para o QR code ou digite o código em Treinamentos › Assinar.</div>
      <div class="qr-caixa"><div id="qr"></div><div class="cod-grande" id="codg">······</div>
        <div class="contagem"><i id="barra" style="width:100%"></i></div><div class="qr-dica">O código muda a cada 15 segundos</div></div></div>
    <div><div class="presentes-n" id="pn">0</div><div>presentes</div><div class="presentes-l" id="pl"></div>
      <div class="palco-ativ" id="pa"></div>
      <div class="linha-btn"><button class="btn claro" onclick="sortear('${id}')">Sortear</button>
      <button class="btn contorno" onclick="fecharPalco(false)">Minimizar</button>
      <button class="btn contorno" onclick="fecharPalco(true)">Encerrar lista</button></div></div></div>`;
  document.body.appendChild(el);
  qrObj = new QRCode($('#qr'), { text:location.origin, width:420, height:420, correctLevel:QRCode.CorrectLevel.M });
  tickLive(); liveTimer = setInterval(tickLive, 2000);
}
async function tickLive() {
  if (!S.live) return;
  try {
    const r = await rpc('treino_ger_codigo', { p_token:tk(), p_treino:S.live.id });
    if (!S.live) return;
    if (!r.aberta) return fecharPalco(false);
    if (r.codigo !== S.live.codigo) {
      S.live.codigo = r.codigo;
      qrObj.clear(); qrObj.makeCode(`${location.origin}/modulos/treinamentos.html?c=${r.codigo}`);
      $('#codg').textContent = r.codigo.slice(0, 3) + ' ' + r.codigo.slice(3);
    }
    const b = $('#barra'); b.style.transition = 'none'; b.style.width = (r.restante / 15 * 100) + '%';
    requestAnimationFrame(() => { b.style.transition = ''; b.style.width = Math.max(0, (r.restante - 2) / 15 * 100) + '%'; });
    $('#pn').textContent = r.presentes.length;
    $('#pl').innerHTML = r.presentes.map(p => `<div><span>${esc(p.nome)} <small>${esc(p.perfil || '')}${p.modo === 'online' ? ' · online' : ''}${p.status === 'fora_do_local' ? ' · fora do local' : ''}</small></span><small>${horaDe(p.assinado_em)}</small></div>`).join('');
    const sig = JSON.stringify(r.atividades);
    if (sig !== S.live.ativSig) {
      S.live.ativSig = sig;
      $('#pa').innerHTML = r.atividades.length ? `<h2>Atividades</h2>` + r.atividades.map(a => `<div class="l"><span>${esc(a.titulo || TIPOS[a.tipo])}<br>
        <small>${TIPOS[a.tipo]} · ${a.n_respostas} resposta${a.n_respostas === 1 ? '' : 's'}</small></span>
        <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ${a.liberada ? 'contorno' : 'claro'} mini" onclick="liberar('${a.id}',${!a.liberada})">${a.liberada ? 'Fechar' : 'Liberar'}</button>
        <button class="btn contorno mini" onclick="verResultado('${a.id}',false)">Mostrar resultado</button></span></div>`).join('') : '';
    }
  } catch (e) { /* tenta de novo no próximo ciclo */ }
}
async function fecharPalco(encerrar) {
  clearInterval(liveTimer); liveTimer = null;
  const id = S.live?.id; S.live = null; $('#palco')?.remove();
  try {
    if (encerrar && id) { await rpc('treino_ger_sessao', { p_token:tk(), p_treino:id, p_abrir:false, p_lat:null, p_lng:null }); toast('Lista de presença encerrada.'); }
    await carregarGer(); render();
  } catch (e) { toast(e.message, true); }
}

// ================= resultado das atividades =================
let resTimer = null;
function verResultado(aid, comNomes) {
  const el = document.createElement('div'); el.className = 'cheia'; el.id = 'resultado';
  el.innerHTML = `<div class="res-in"><div id="resc"><p>Carregando…</p></div>
    <div class="linha-btn" style="margin-top:28px"><button class="btn claro" onclick="fecharResultado()">Fechar</button></div></div>`;
  document.body.appendChild(el);
  const tick = async () => {
    try { const r = await rpc('treino_ger_resultado', { p_token:tk(), p_atividade:aid }); if ($('#resc')) $('#resc').innerHTML = htmlResultado(r, comNomes); }
    catch (e) { toast(e.message, true); }
  };
  tick(); resTimer = setInterval(tick, 3000);
}
function fecharResultado() { clearInterval(resTimer); resTimer = null; $('#resultado')?.remove(); if (!S.live) carregarGer().then(render).catch(() => {}); }
function barra(txt, n, total, extra = '') {
  const pct = total ? Math.round(n / total * 100) : 0;
  return `<div class="rbar"><div class="t"><span>${txt}</span><span>${n} <small>(${pct}%)</small></span></div>
    <div class="b"><i style="width:${pct}%"></i></div>${extra}</div>`;
}
function htmlResultado(r, comNomes) {
  const d = r.dados, R = r.respostas, nomes = comNomes && !r.anonima;
  let h = `<div style="color:#D9CCF0;font-weight:600">${TIPOS[r.tipo]} · ${R.length} de ${r.presentes} presentes responderam</div>
    <h1 style="margin-top:6px">${esc(r.titulo || d.pergunta || '')}</h1>`;
  if (r.tipo === 'enquete') {
    if (r.titulo && d.pergunta) h += `<p style="font-size:20px">${esc(d.pergunta)}</p>`;
    h += d.opcoes.map((o, j) => {
      const quem = R.filter(x => (x.resposta.opcoes || []).includes(j));
      return barra(esc(o), quem.length, R.length, nomes && quem.length ? `<small style="color:#D9CCF0">${quem.map(x => esc(x.nome)).join(', ')}</small>` : '');
    }).join('');
  } else if (r.tipo === 'quiz') {
    const media = R.length ? (R.reduce((s, x) => s + Number(x.nota || 0), 0) / R.length) : 0;
    h += `<p style="font-size:22px">Nota média: <b>${media.toFixed(1).replace('.', ',')}</b> de 10</p>`;
    h += d.perguntas.map((q, i) => {
      const ac = R.filter(x => x.resposta.respostas[i] === q.correta).length;
      return barra(`${i + 1}. ${esc(q.texto)} <small>· certa: ${esc(q.opcoes[q.correta])}</small>`, ac, R.length);
    }).join('');
    if (nomes && R.length) h += `<h2 style="color:#fff">Notas</h2>` + R.slice().sort((a, b) => b.nota - a.nota).map(x =>
      `<div class="rtexto" style="display:flex;justify-content:space-between"><span>${esc(x.nome)}</span><b>${String(x.nota).replace('.', ',')}</b></div>`).join('');
  } else if (r.tipo === 'aberta') {
    if (r.titulo && d.pergunta) h += `<p style="font-size:20px">${esc(d.pergunta)}</p>`;
    h += R.length ? R.map(x => `<div class="rtexto">${esc(x.resposta.texto)}${nomes ? `<small>${esc(x.nome)}</small>` : ''}</div>`).join('') : '<p>Ainda sem respostas.</p>';
  } else {
    h += barra('Marcaram como respondido', R.length, r.presentes);
    if (nomes && R.length) h += `<p style="color:#D9CCF0">${R.map(x => esc(x.nome)).join(', ')}</p>`;
  }
  return h;
}

// ================= sorteio =================
async function sortear(id) {
  const semRep = confirm('Não repetir quem já foi sorteado neste treinamento?\n\nOK = não repetir · Cancelar = todos concorrem');
  let r;
  try { r = await rpc('treino_ger_sortear', { p_token:tk(), p_treino:id, p_sem_repetir:semRep }); }
  catch (e) { return toast(e.message, true); }
  const el = document.createElement('div'); el.className = 'cheia centro'; el.id = 'sorteio';
  el.innerHTML = `<div style="font-weight:600;color:#D9CCF0;margin-bottom:18px">Sorteio</div><div class="rolo" id="rolo" aria-live="polite"></div>
    <div class="linha-btn" id="sfim" style="justify-content:center;visibility:hidden;margin-top:34px">
    <button class="btn claro" onclick="$('#sorteio').remove();sortear('${id}')">Sortear outra pessoa</button>
    <button class="btn contorno" onclick="$('#sorteio').remove();if(!S.live){carregarGer().then(render)}">Fechar</button></div>`;
  document.body.appendChild(el);
  const nomes = r.nomes.length ? r.nomes : [r.nome], rolo = $('#rolo');
  const fim = () => { rolo.textContent = r.nome; rolo.classList.add('fim'); $('#sfim').style.visibility = 'visible'; };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || nomes.length < 2) return setTimeout(fim, 600);
  let atraso = 50, i = Math.floor(Math.random() * nomes.length);
  (function gira() {
    rolo.textContent = nomes[i++ % nomes.length]; atraso *= 1.09;
    if (atraso > 420) return setTimeout(fim, 380);
    setTimeout(gira, atraso);
  })();
}

// ================= impressão =================
function imprimir(id) {
  const t = S.dados.treinamentos.find(x => x.id === id);
  const pres = new Map(presencasDe(id).map(p => [p.pessoa_id, p]));
  const conv = convocados(t).sort((a, b) => a.nome.localeCompare(b.nome));
  $('#print').innerHTML = `<h1>Lista de presença · ${esc(t.titulo)}</h1>
    <p>Harmonia Animal · ${dataBR(t.data)} · ${t.hora_inicio}${t.hora_fim ? '–' + t.hora_fim : ''} · ${MODAL[t.modalidade]}${t.local_texto ? ' · ' + esc(t.local_texto) : ''}${t.responsavel ? ' · Responsável: ' + esc(t.responsavel) : ''}</p>
    ${t.conteudo ? `<p style="white-space:pre-wrap"><b>Conteúdo:</b> ${esc(t.conteudo)}</p>` : ''}
    <table><thead><tr><th>Nome</th><th>Perfil</th><th>Situação</th><th>Assinatura digital</th></tr></thead><tbody>
    ${conv.map(p => { const pr = pres.get(p.id); return `<tr><td>${esc(p.nome)}</td><td>${esc(p.perfil || '')}</td>
      <td>${pr ? (STATUS[pr.status]?.[0] || 'Presente') + (pr.modo === 'online' ? ' (online)' : '') + (pr.atrasado ? ' · atrasado' : '') : 'Ausente'}</td>
      <td>${pr && pr.status !== 'manual' ? new Date(pr.assinado_em).toLocaleString('pt-BR') : (pr ? 'lançado pela gestão' : '')}</td></tr>`; }).join('')}
    </tbody></table><p style="margin-top:14px">Presentes: ${pres.size} de ${conv.length}</p>`;
  window.print();
}

// ================= relatórios =================
function vRel() {
  if (!S.dados) return '<p class="muted">Carregando…</p>';
  const hoje = hojeISO();
  if (!S.relDe) { const d = new Date(); d.setDate(d.getDate() - 90); S.relDe = d.toISOString().slice(0, 10); S.relAte = hoje; }
  const ts = S.dados.treinamentos.filter(t => t.data >= S.relDe && t.data <= S.relAte && t.data <= hoje);
  const ids = new Set(ts.map(t => t.id)), obrig = ts.filter(t => t.obrigatorio);
  const presSet = new Set(S.dados.presencas.map(p => p.treinamento_id + '|' + p.pessoa_id));
  const notas = S.dados.notas.filter(n => ids.has(n.treinamento_id));
  const porPessoa = S.dados.pessoas.filter(p => p.ativo).map(p => {
    const conv = obrig.filter(t => (p.convocavel && (!t.funcoes.length || t.funcoes.includes(p.perfil))) || presSet.has(t.id + '|' + p.id));
    const pres = conv.filter(t => presSet.has(t.id + '|' + p.id)).length;
    const extra = ts.filter(t => !t.obrigatorio && presSet.has(t.id + '|' + p.id)).length;
    const ns = notas.filter(n => n.pessoa_id === p.id).map(n => Number(n.nota));
    return { ...p, conv:conv.length, pres, faltas:conv.length - pres, extra, pct:conv.length ? pres / conv.length : null,
      quiz:ns.length ? ns.reduce((a, b) => a + b, 0) / ns.length : null };
  }).filter(p => p.conv || p.extra)
    .sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1) || (b.pres + b.extra) - (a.pres + a.extra) || a.nome.localeCompare(b.nome));
  const totConv = porPessoa.reduce((s, p) => s + p.conv, 0), totPres = porPessoa.reduce((s, p) => s + p.pres, 0);
  const pctTxt = v => v === null ? '–' : Math.round(v * 100) + '%';
  const nTxt = v => v === null ? '–' : v.toFixed(1).replace('.', ',');
  const porTreino = ts.map(t => { const c = convocados(t).length, p = presencasDe(t.id).length; return { t, c, p, pct:c ? p / c : 0 }; });
  return `<h1>Relatórios</h1>
    <div class="duas"><label class="f"><span>De</span><input type="date" value="${S.relDe}" onchange="S.relDe=this.value;render()"></label>
    <label class="f"><span>Até</span><input type="date" value="${S.relAte}" onchange="S.relAte=this.value;render()"></label></div>
    <div class="resumo"><div><b>${ts.length}</b><span>treinamentos</span></div><div><b>${totConv ? Math.round(totPres / totConv * 100) + '%' : '–'}</b><span>presença geral</span></div>
    <div><b>${totConv - totPres}</b><span>faltas</span></div></div>
    <h2>Por pessoa</h2>
    ${porPessoa.length ? `<div class="card rolagem" style="padding:6px 10px"><table><thead><tr><th>Nome</th><th class="n">Presença</th><th></th><th class="n">Foi</th><th class="n">Faltou</th><th class="n">Extras</th><th class="n">Quiz</th></tr></thead><tbody>
      ${porPessoa.map(p => `<tr><td><b>${esc(p.nome)}</b><br><span class="muted small">${esc(p.perfil || '')}</span></td><td class="n">${pctTxt(p.pct)}</td>
        <td style="width:18%"><div class="barra"><i style="width:${(p.pct ?? 0) * 100}%"></i></div></td>
        <td class="n">${p.pres}</td><td class="n">${p.faltas}</td><td class="n">${p.extra}</td><td class="n">${nTxt(p.quiz)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="muted small" style="margin-top:8px">Presença conta só os treinamentos obrigatórios para o perfil da pessoa. “Extras” são opcionais que ela fez. Quiz é a nota média, de 0 a 10.</p>`
    : '<div class="vazio">Sem treinamentos realizados neste período.</div>'}
    ${porTreino.length ? `<h2>Por treinamento</h2><div class="card rolagem" style="padding:6px 10px"><table><thead><tr><th>Treinamento</th><th class="n">Presentes</th><th class="n">%</th></tr></thead><tbody>
      ${porTreino.map(x => `<tr><td><button class="voltar" style="padding:0;text-align:left" onclick="abrirTreino('${x.t.id}')">${esc(x.t.titulo)}</button><br><span class="muted small">${dataBR(x.t.data)}${x.t.obrigatorio ? '' : ' · opcional'}</span></td>
        <td class="n">${x.p}/${x.c}</td><td class="n">${Math.round(x.pct * 100)}%</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}

// ================= início =================
(async function init() {
  const c = new URLSearchParams(location.search).get('c');
  if (c) {
    history.replaceState(null, '', location.pathname);
    try { const p = await rpc('treino_validar_codigo', { p_codigo:c }); sessionStorage.setItem('treino_pend', JSON.stringify(p)); }
    catch (e) { toast(e.message, true); }
  }
  if (!H.token) return irLogin();
  try { S.pendente = JSON.parse(sessionStorage.getItem('treino_pend') || 'null'); } catch {}
  try { S.acesso = await rpc('portal_acesso', { p_token:H.token, p_modulo:'treinamentos' }); }
  catch (e) {
    if (!H.token) return;
    $('#app').innerHTML = `${cabecalho('Treinamentos')}<main class="wrap"><h1>Sem acesso</h1><p>${esc(e.message)}</p><a class="btn" href="/">Voltar ao portal</a></main>`;
    return;
  }
  S.ger = S.acesso.nivel === 'gerencia';
  if (S.pendente) { S.view = 'confirmar'; render(); }
  else ir(S.ger ? 'treinos' : 'meus');
})();
</script>
